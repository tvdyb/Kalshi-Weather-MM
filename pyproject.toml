[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kweather"
version = "0.1.0"
description = "Localhost market-maker for Kalshi weather (KXHIGH/KXLOW) markets"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "uvloop>=0.19; sys_platform != 'win32'",
  "httpx>=0.27",
  "websockets>=12.0",
  "orjson>=3.10",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "cryptography>=42",
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.2",
  "pyarrow>=16",
  "python-dotenv>=1.0",
  "sse-starlette>=2.1",
  "jinja2>=3.1",
  "aiosqlite>=0.20",
  "tenacity>=8.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "respx>=0.21",
]

[project.scripts]
kweather = "kweather.main:cli"

[tool.setuptools.packages.find]
include = ["kweather*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101", "S104", "B008", "S311", "S110", "S112", "B904", "E501", "RUF046", "RUF005", "UP042", "RUF059"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
